name: Atualizar métricas

on:
  schedule:
    - cron: "17 9 * * *"   # todos os dias, 06:17 (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar bases
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
          IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
        run: python scripts/update_metrics.py
      - name: Salvar alterações
        run: |
          if git diff --quiet data/metrics.json; then echo "Sem mudanças"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/metrics.json
          git commit -m "Atualiza métricas bibliométricas"
          git push
          # commits feitos pelo GITHUB_TOKEN não disparam o Pages sozinhos
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
